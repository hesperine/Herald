[project]
name = "herald"
version = "0.1.0"
description = "GitHub Actions powered tracker for game IP collaborations"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "python-dateutil>=2.9.0,<3.0.0",
    "sniffio>=1.3.0,<2.0.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
]

[project.scripts]
herald = "herald.cli:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/herald"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
